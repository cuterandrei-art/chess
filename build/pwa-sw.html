<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  /* The browser can offer the install before the app's own script has run, and
     the event is only usable if it was caught. So catch it here and leave it
     where the in-app Install button looks for it — the button, the wording and
     the per-browser fallbacks all live in the app itself. */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__deferredInstall = e;
    try { window.dispatchEvent(new Event('installready')); } catch (err) {}
  });
</script>
