name: Tests

# Runs the whole validation battery against work/openingtrainer.html on every
# push. The suites parse the app, guard against duplicate top-level
# declarations (a SyntaxError in the browser that a plain parse test misses),
# and exercise every career system end to end.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Run the validation battery
        run: |
          fail=0
          for f in validate-*.mjs; do
            if out=$(node "$f" 2>&1); then
              printf '✅ %-26s %s\n' "$f" "$(printf '%s' "$out" | tail -1)"
            else
              printf '❌ %s\n' "$f"
              printf '%s\n' "$out" | tail -30
              fail=1
            fi
          done
          exit $fail
