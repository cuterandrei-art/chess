name: Deploy the app to GitHub Pages

# Publishes the installable PWA so you can open it on your phone and use
# "Add to Home Screen". Once this has run, the app is live at:
#   https://cuterandrei-art.github.io/chess/
#
# The service-worker cache is named after the commit, so every deploy pushes a
# fresh copy to phones that already have it installed instead of serving the
# old one from cache.

on:
  push:
    branches:
      - main
      - claude/charming-ramanujan-v52cqu
    paths:
      - 'work/openingtrainer.html'
      - 'build/**'
      - 'build-netlify.mjs'
      - 'netlify/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Check the app before publishing it
        run: node validate-smoke.mjs

      - name: Build the PWA bundle
        run: node build-netlify.mjs "${GITHUB_SHA::7}"

      - name: Assemble the site
        run: |
          rm -rf _site && mkdir -p _site
          cp netlify/index.html netlify/sw.js netlify/manifest.webmanifest _site/
          cp netlify/icon-192.png netlify/icon-512.png netlify/icon-512-maskable.png \
             netlify/apple-touch-icon.png netlify/favicon-32.png _site/
          touch _site/.nojekyll
          ls -la _site

      # The workflow token is not allowed to turn Pages on for the first time,
      # and the error it produces is cryptic. Say plainly what to click.
      - name: Check that Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Source to 'GitHub Actions'. It is a one-time switch — this workflow cannot flip it. Then re-run this job and the app will be live at https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)/"
            exit 1
          fi
          echo "Pages is enabled — deploying."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
